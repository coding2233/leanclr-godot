name: Godot LeanCLR image

# Builds the slim runtime image from prebuilt release binaries. The expensive
# editor/template compilation lives in the "LeanCLR release binaries" workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the prebuilt LeanCLR bundle
        type: string
        default: v4.7.2
      push_to_ghcr:
        description: Push the built image to GHCR
        type: boolean
        default: true
      force_rebuild:
        description: Rebuild even when the content-hash image already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: godot-leanclr-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRIMARY_TAG: ${{ inputs.release_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CACHE_TAG: buildcache-image
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve the GHCR image name
        id: image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "name=ghcr.io/${owner,,}/godot-leanclr" >> "${GITHUB_OUTPUT}"

      - name: Check the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} not found. Run the LeanCLR release binaries workflow first."
            exit 1
          fi

      - name: Download the prebuilt bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf download bundle
          mkdir -p download
          gh release download "${TAG}" --dir download
          cd download
          sha256sum -c SHA256SUMS
          cd ..
          mkdir -p bundle
          tar -xzf download/leanclr-web-bundle-*.tar.gz -C bundle
          test -f bundle/leanclr/publish

      - name: Verify the bundle bridge patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          dll = Path("bundle/leanclr/managed/GodotSharp.dll")
          data = dll.read_bytes()
          if "LEANCLR_BRIDGE_LOOKUP".encode("utf-16-le") not in data:
              raise SystemExit(
                  "stale bundle: GodotSharp bridge diagnostics missing; rerun LeanCLR release binaries")
          profile = json.loads(Path("bundle/leanclr/profile.json").read_text(encoding="utf-8"))
          print("bundle godotsharp", profile.get("godotsharp_sha256"))
          print("bundle calli", profile.get("calli_sha256"))
          PY

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/local/lib/node_modules \
            /opt/az \
            /opt/microsoft \
            /opt/pipx
          sudo apt-get clean
          docker system prune -af || true
          docker builder prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute the content revision
        id: revision
        run: |
          set -euo pipefail
          digest="$(
            {
              sha256sum Dockerfile .dockerignore
              find bundle -type f -print0 | sort -z | xargs -0 sha256sum
              echo "${RELEASE_TAG}"
            } | sha256sum | cut -c1-12
          )"
          echo "tag=${PRIMARY_TAG}-${digest}" >> "${GITHUB_OUTPUT}"
          echo "Content tag: ${PRIMARY_TAG}-${digest}"

      - name: Check whether the image already exists
        id: exists
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION_TAG: ${{ steps.revision.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${REVISION_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pull the existing image
        if: ${{ steps.exists.outputs.exists == 'true' && !inputs.force_rebuild }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION_TAG: ${{ steps.revision.outputs.tag }}
        run: docker pull "${IMAGE}:${REVISION_TAG}"

      - name: Build image
        if: ${{ steps.exists.outputs.exists != 'true' || inputs.force_rebuild }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.revision.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ env.PRIMARY_TAG }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:${{ env.CACHE_TAG }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:${{ env.CACHE_TAG }},mode=max

      - name: Smoke-test the image entrypoint
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION_TAG: ${{ steps.revision.outputs.tag }}
        run: |
          set -euo pipefail
          image="${IMAGE}:${REVISION_TAG}"
          if ! docker image inspect "${image}" >/dev/null 2>&1; then
            image="${IMAGE}:${PRIMARY_TAG}"
          fi
          docker run --rm "${image}" --ready
          docker image inspect "${image}" --format 'Uncompressed size: {{.Size}} bytes'

      - name: Install Playwright Chromium
        run: |
          set -eux
          python3 -m pip install --break-system-packages --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Export the sample to Web and smoke-test it
        run: |
          set -euo pipefail
          rm -rf build/docker-web build/docker-cache
          mkdir -p build/docker-cache
          docker run --rm \
            -v "${PWD}":/src \
            -v "${PWD}/build/docker-cache":/cache \
            "${{ steps.image.outputs.name }}:${{ steps.revision.outputs.tag }}" \
            --targets web \
            --project /src/samples/dotnet \
            --output /src/build/docker-web
          test -f build/docker-web/index.html
          python3 tools/smoke_web.py --directory build/docker-web

      - name: Push image and aliases
        if: ${{ inputs.push_to_ghcr && (steps.exists.outputs.exists != 'true' || inputs.force_rebuild) }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION_TAG: ${{ steps.revision.outputs.tag }}
          PRIMARY_TAG: ${{ env.PRIMARY_TAG }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${REVISION_TAG}"
          docker push "${IMAGE}:${PRIMARY_TAG}"

      - name: Refresh the primary alias for an existing image
        if: ${{ inputs.push_to_ghcr && steps.exists.outputs.exists == 'true' && !inputs.force_rebuild }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION_TAG: ${{ steps.revision.outputs.tag }}
          PRIMARY_TAG: ${{ env.PRIMARY_TAG }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${PRIMARY_TAG}" \
            "${IMAGE}:${REVISION_TAG}"

      - name: Verify the published manifest
        if: ${{ inputs.push_to_ghcr }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PRIMARY_TAG: ${{ env.PRIMARY_TAG }}
        run: docker buildx imagetools inspect "${IMAGE}:${PRIMARY_TAG}"

      - name: Upload publication logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-publication-logs
          path: |
            build/docker-cache/**/*.log
            build/docker-cache/**/publication.json
            build/docker-cache/**/manifest.json
            build/docker-web/**
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION_TAG: ${{ steps.revision.outputs.tag }}
          PRIMARY_TAG: ${{ env.PRIMARY_TAG }}
          PUSHED: ${{ inputs.push_to_ghcr }}
          EXISTED: ${{ steps.exists.outputs.exists }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          {
            echo "## godot-leanclr image"
            echo
            echo "- Image: \`${IMAGE}:${PRIMARY_TAG}\`"
            echo "- Content tag: \`${REVISION_TAG}\`"
            echo "- Release bundle: \`${RELEASE_TAG}\`"
            echo "- Reused existing image: \`${EXISTED}\`"
            echo "- Pushed to GHCR: \`${PUSHED}\`"
            echo
            echo '```'
            df -h /
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
