name: LeanCLR release binaries

# Manual release pipeline. Builds the prebuilt LeanCLR editor and export
# templates once, then publishes them as GitHub Release assets consumed by the
# slim Docker image.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (must match the Docker image tag)
        type: string
        default: v4.7.2

permissions:
  contents: write
  packages: write

concurrency:
  group: leanclr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Resolve the GHCR image name
        id: image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "name=ghcr.io/${owner,,}/godot-leanclr" >> "${GITHUB_OUTPUT}"

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/local/lib/node_modules \
            /opt/az \
            /opt/microsoft \
            /opt/pipx
          sudo apt-get clean
          docker system prune -af || true
          docker builder prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build prebuilt bundle
        run: |
          set -euo pipefail
          mkdir -p bundle-out
          docker buildx build \
            --file Dockerfile.builder \
            --target bundle \
            --no-cache-filter leanclr-linux \
            --output type=local,dest=bundle-out \
            --cache-from type=registry,ref=${{ steps.image.outputs.name }}:buildcache-bundle \
            --cache-to type=registry,ref=${{ steps.image.outputs.name }}:buildcache-bundle,mode=max \
            .

      - name: Package release assets
        run: |
          set -euo pipefail
          python3 tools/pack_bundle.py \
            --leanclr bundle-out/leanclr \
            --out dist \
            --version "${RELEASE_TAG}"
          ls -lh dist

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leanclr-release-bundle
          path: dist/*
          if-no-files-found: error

      - name: Build and smoke-test the runtime image
        run: |
          set -euo pipefail
          rm -rf bundle build/release-smoke build/release-cache
          mkdir -p bundle
          cp -a bundle-out/leanclr bundle/leanclr
          docker build -t godot-leanclr:release-test .
          docker run --rm godot-leanclr:release-test --ready
          mkdir -p build/release-cache
          docker run --rm \
            -v "${PWD}":/src \
            -v "${PWD}/build/release-cache":/cache \
            godot-leanclr:release-test \
            --project /src/samples/dotnet \
            --output /src/build/release-smoke
          test -f build/release-smoke/leanclr-game.x86_64
          cd build/release-smoke
          timeout 180 ./leanclr-game.x86_64 --headless -- --m0-smoke 2>&1 | sudo tee smoke.log
          grep -q 'NODE2D_SMOKE_OK' smoke.log
          grep -q 'LEANCLR_ATTACH ready' smoke.log
          grep -q 'LEANCLR_BRIDGE_LOOKUP' smoke.log

      - name: Delete the existing release and tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          # A fork or a repository with read-only workflow permissions needs a
          # PAT in RELEASE_TOKEN (repo/contents write).
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            for (const release of releases.data) {
              if (release.tag_name === tag) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              }
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              core.info(`tag ${tag} not found: ${error.message}`);
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: dist/*
