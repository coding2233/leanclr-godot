name: LeanCLR release binaries

# Manual release pipeline. Builds the prebuilt LeanCLR editor and export
# templates once, then publishes them as GitHub Release assets consumed by the
# slim Docker image.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        type: string
        default: v4.7.2
      overwrite:
        description: Replace assets if the release already exists
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: leanclr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Resolve the GHCR image name
        id: image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "name=ghcr.io/${owner,,}/godot-leanclr" >> "${GITHUB_OUTPUT}"

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/local/lib/node_modules \
            /opt/az \
            /opt/microsoft \
            /opt/pipx
          sudo apt-get clean
          docker system prune -af || true
          docker builder prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build prebuilt bundle
        run: |
          set -euo pipefail
          mkdir -p bundle-out
          docker buildx build \
            --file Dockerfile.builder \
            --target bundle \
            --output type=local,dest=bundle-out \
            --cache-from type=registry,ref=${{ steps.image.outputs.name }}:buildcache-bundle \
            --cache-to type=registry,ref=${{ steps.image.outputs.name }}:buildcache-bundle,mode=max \
            .

      - name: Package release assets
        run: |
          set -euo pipefail
          python3 tools/pack_bundle.py \
            --leanclr bundle-out/leanclr \
            --out dist \
            --version "${{ inputs.release_tag }}"
          ls -lh dist

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leanclr-release-bundle
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "${OVERWRITE}" = "true" ]; then
              gh release upload "${TAG}" dist/* --clobber
            else
              echo "release ${TAG} already exists; assets left unchanged" >&2
              exit 1
            fi
          else
            gh release create "${TAG}" dist/* \
              --title "LeanCLR Godot ${TAG}" \
              --notes "Prebuilt LeanCLR editor and export templates for the slim godot-leanclr runtime image."
          fi
          gh release view "${TAG}"
